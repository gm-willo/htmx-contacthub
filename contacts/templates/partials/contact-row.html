<tr>
    <td>{{ contact.name }}</td>
    <td>{{ contact.email }}</td>
    <td>{{ contact.created_at|date:'d M Y' }}</td>
    <td>
        <button
            hx-delete="{% url "delete-contact" contact.pk %}"
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
            class="btn btn-xs btn-error">
            Delete
        </button>
    </td>
</tr>
